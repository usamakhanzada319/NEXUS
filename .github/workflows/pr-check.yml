name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  pr-check:
    name: PR validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5

        with:
          node-version: 24.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Test check
        run: npm run test:run

      - name: Build check
        run: npm run build

      - name: PR Check Passed
        run: echo "All checks passed! Ready to merge."
